<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title desc"><title id="title">PAC na prática — cena explicativa</title><desc id="desc">Ciclo didático do PAC com três resultados de conferência. Ilustração original e esquemática, não é uma captura oficial do PJe.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0F2B44"/><stop offset="1" stop-color="#1B4967"/></linearGradient></defs><rect width="800" height="530" rx="26" fill="url(#bg)"/><text x="35" y="43" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#9DD6F6" text-anchor="start">RAF SERVENTIA DOCS · O-08</text><text x="35" y="86" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">PAC na prática</text><rect x="46" y="164" width="170" height="140" rx="16" fill="#244B69" stroke="#5E9ABB"/><text x="131" y="211" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. Identificar</text><text x="131" y="247" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#BEE1F6" text-anchor="middle">O que falta?</text><text x="218" y="243" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#F2C270" text-anchor="start">→</text><rect x="234" y="164" width="170" height="140" rx="16" fill="#244B69" stroke="#5E9ABB"/><text x="319" y="211" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Conferir</text><text x="319" y="247" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#BEE1F6" text-anchor="middle">Ordem, prazo e parte</text><text x="406" y="243" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#F2C270" text-anchor="start">→</text><rect x="422" y="164" width="170" height="140" rx="16" fill="#244B69" stroke="#5E9ABB"/><text x="507" y="211" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Comunicar</text><text x="507" y="247" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#BEE1F6" text-anchor="middle">Sob supervisão</text><text x="594" y="243" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#F2C270" text-anchor="start">→</text><rect x="610" y="164" width="170" height="140" rx="16" fill="#244B69" stroke="#5E9ABB"/><text x="695" y="211" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Examinar</text><text x="695" y="247" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#BEE1F6" text-anchor="middle">Resposta recebida</text><rect x="70" y="365" width="185" height="42" rx="13" fill="#1B8268" stroke="#1B8268"/><text x="84" y="392" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">Cumpriu</text><rect x="308" y="365" width="185" height="42" rx="13" fill="#B87D2B" stroke="#B87D2B"/><text x="322" y="392" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">Parcial</text><rect x="546" y="365" width="185" height="42" rx="13" fill="#B84A47" stroke="#B84A47"/><text x="560" y="392" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">Não cumpriu</text><text x="97" y="448" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#BDD7E6" text-anchor="start">Comparar a resposta com a determinação; consultar servidor.</text><text x="35" y="502" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#AACBDE" text-anchor="start">ILUSTRAÇÃO DIDÁTICA · EXEMPLO FICTÍCIO · NÃO É TELA OFICIAL</text></svg>