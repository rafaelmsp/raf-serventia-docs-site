<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">O-08 — passos ilustrados</title><desc id="d">Quatro etapas resumidas para aprender a conferência sob supervisão. Não representa decisão processual.</desc><defs><filter id="ds"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#051B2C" flood-opacity=".23"/></filter></defs><rect x="0" y="0" width="1200" height="590" rx="26" fill="#102D46"/><text x="49" y="59" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#B5D8EA" text-anchor="start" letter-spacing="2">GUIA VISUAL DE ESTUDO</text><text x="49" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#FFF" text-anchor="start" >PAC na prática</text><rect x="934" y="48" width="214" height="35" rx="17" fill="#1688D0"/><text x="1041.0" y="71" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle" >ROTEIRO DIDÁTICO</text><text x="50" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#B5CFE1" text-anchor="start" >Use este esquema para lembrar o que conferir.</text><text x="50" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#B5CFE1" text-anchor="start" >A execução de atos depende da supervisão da unidade.</text><rect x="42" y="213" width="247" height="227" rx="18" fill="#F6FAFD" stroke="#B7D2E5" stroke-width="2" filter="url(#ds)"/><rect x="42" y="213" width="247" height="58" rx="16" fill="#1688D0"/><rect x="42" y="245" width="247" height="25" rx="0" fill="#1688D0"/><circle cx="74" cy="243" r="17" fill="#1688D0" stroke="#FFFFFF" stroke-width="3"/><text x="74" y="249" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" >1</text><text x="65" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#174663" text-anchor="start" >Identifique a falha</text><text x="65" y="351" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >Descreva de forma objetiva</text><text x="65" y="375" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >o documento ou informação</text><text x="65" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >faltante.</text><line x1="293" y1="324" x2="328" y2="324" stroke="#96C5E5" stroke-width="3" stroke-linecap="round" /><path d="M319 318L328 324L319 330" stroke="#96C5E5" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="333" y="213" width="247" height="227" rx="18" fill="#F6FAFD" stroke="#B7D2E5" stroke-width="2" filter="url(#ds)"/><rect x="333" y="213" width="247" height="58" rx="16" fill="#1688D0"/><rect x="333" y="245" width="247" height="25" rx="0" fill="#1688D0"/><circle cx="365" cy="243" r="17" fill="#1688D0" stroke="#FFFFFF" stroke-width="3"/><text x="365" y="249" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" >2</text><text x="356" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#174663" text-anchor="start" >Confira a determinação</text><text x="356" y="332" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#174663" text-anchor="start" >e o destinatário</text><text x="356" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >Verifique qual providência</text><text x="356" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >foi solicitada, quem deve</text><text x="356" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >realizá-la e o prazo</text><line x1="584" y1="324" x2="619" y2="324" stroke="#96C5E5" stroke-width="3" stroke-linecap="round" /><path d="M610 318L619 324L610 330" stroke="#96C5E5" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="625" y="213" width="247" height="227" rx="18" fill="#F6FAFD" stroke="#B7D2E5" stroke-width="2" filter="url(#ds)"/><rect x="625" y="213" width="247" height="58" rx="16" fill="#1688D0"/><rect x="625" y="245" width="247" height="25" rx="0" fill="#1688D0"/><circle cx="657" cy="243" r="17" fill="#1688D0" stroke="#FFFFFF" stroke-width="3"/><text x="657" y="249" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" >3</text><text x="648" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#174663" text-anchor="start" >Acompanhe a comunicação</text><text x="648" y="332" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#174663" text-anchor="start" >com supervisão</text><text x="648" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >A forma do PAC/intimação</text><text x="648" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >deve seguir a orientação</text><text x="648" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >validada da unidade.</text><line x1="876" y1="324" x2="911" y2="324" stroke="#96C5E5" stroke-width="3" stroke-linecap="round" /><path d="M902 318L911 324L902 330" stroke="#96C5E5" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><rect x="916" y="213" width="247" height="227" rx="18" fill="#F6FAFD" stroke="#B7D2E5" stroke-width="2" filter="url(#ds)"/><rect x="916" y="213" width="247" height="58" rx="16" fill="#1688D0"/><rect x="916" y="245" width="247" height="25" rx="0" fill="#1688D0"/><circle cx="948" cy="243" r="17" fill="#1688D0" stroke="#FFFFFF" stroke-width="3"/><text x="948" y="249" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" >4</text><text x="939" y="311" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#174663" text-anchor="start" >Compare a resposta</text><text x="939" y="332" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#174663" text-anchor="start" >à exigência</text><text x="939" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >Diferencie atendimento</text><text x="939" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >integral, parcial e</text><text x="939" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#607F95" text-anchor="start" >ausência de cumprimento.</text><rect x="54" y="478" width="1090" height="61" rx="12" fill="#17455F"/><circle cx="87" cy="509" r="12" fill="#259984"/><path d="M 81 509 l4 4 8 -9" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="113" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#D5EEFB" text-anchor="start" >Depois da conferência: descreva o que foi observado e consulte o servidor quando necessário.</text><text x="52" y="572" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#B0CFDD" text-anchor="start" >DIAGRAMA ORIENTATIVO · ROTEIRO SIMULADO · NÃO É INSTRUÇÃO AUTOMÁTICA DO PJe</text></svg>